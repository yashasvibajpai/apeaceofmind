<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA Radio Hub</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Pricedown', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 0;
            min-height: 100vh;
            margin: 0;
            user-select: none;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Pricedown';
            src: url('https://db.onlinewebfonts.com/t/2db1c01e63a32fcfc366ff56bc1b8495.woff2') format('woff2');
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 2rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .radio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
            width: 80%;
            max-width: 800px;
        }

        .station-btn {
            background-color: #333;
            border: 2px solid #555;
            color: #fff;
            padding: 1rem;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-align: center;
            font-family: inherit;
        }

        .station-btn:hover {
            background-color: #444;
            border-color: #777;
        }

        .station-btn.active {
            background-color: #e6a822; /* GTA SA Gold/Yellow */
            color: #111;
            border-color: #e6a822;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(230, 168, 34, 0.5);
        }

        .controls {
            margin-top: 3rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        input[type="range"] {
            width: 200px;
            accent-color: #e6a822;
        }

        .station-info {
            margin-top: 2rem;
            font-size: 1.5rem;
            min-height: 2rem;
            color: #e6a822;
        }

        .game-header {
            grid-column: 1 / -1;
            font-size: 2rem;
            color: #e6a822;
            text-align: center;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid #555;
            padding-bottom: 0.5rem;
        }

        .scrambler-btn {
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            border: 2px solid #fff;
            color: #fff;
            padding: 1rem 2rem;
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 8px;
            text-transform: uppercase;
            font-family: inherit;
            letter-spacing: 2px;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.5), 0 0 20px rgba(0, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        .scrambler-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.8), 0 0 25px rgba(0, 255, 255, 0.8);
        }

        .scrambler-btn.active {
            animation: pulse 1s infinite alternate;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 10px rgba(255, 0, 255, 0.5), 0 0 20px rgba(0, 255, 255, 0.5); }
            100% { box-shadow: 0 0 20px rgba(255, 0, 255, 1), 0 0 40px rgba(0, 255, 255, 1); }
        }
    </style>
</head>
<body>

    <h1>GTA Radio Hub</h1>

    <div class="radio-grid" id="stationContainer">
        <!-- Stations will be generated here -->
    </div>

    <div class="station-info" id="currentStation">Tuned Out</div>

    <div class="controls">
        <button id="scramblerBtn" class="scrambler-btn">📼 Scrambler</button>
        <label for="volume">Volume</label>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="0.5">
    </div>

    <audio id="radioPlayer"></audio>

    <script>
        const stationsByGame = {
            "GTA San Andreas": [
                { name: "Bounce FM", url: "https://archive.org/download/gta-san-andreas-radio-stations/Bounce%20FM.mp3" },
                { name: "CSR 103.9", url: "https://archive.org/download/gta-san-andreas-radio-stations/CSR%20103.9.mp3" },
                { name: "K-DST", url: "https://archive.org/download/gta-san-andreas-radio-stations/K-DST.mp3" },
                { name: "K-Jah West", url: "https://archive.org/download/gta-san-andreas-radio-stations/K-Jah%20West.mp3" },
                { name: "K-Rose", url: "https://archive.org/download/gta-san-andreas-radio-stations/K-Rose.mp3" },
                { name: "Master Sounds 98.3", url: "https://archive.org/download/gta-san-andreas-radio-stations/Master%20Sounds%2098.3.mp3" },
                { name: "Playback FM", url: "https://archive.org/download/gta-san-andreas-radio-stations/Playback%20FM.mp3" },
                { name: "Radio Los Santos", url: "https://archive.org/download/gta-san-andreas-radio-stations/Radio%20Los%20Santos.mp3" },
                { name: "Radio X", url: "https://archive.org/download/gta-san-andreas-radio-stations/Radio%20X.mp3" },
                { name: "SF-UR", url: "https://archive.org/download/gta-san-andreas-radio-stations/SF-UR.mp3" }
            ],
            "GTA Vice City": [
                { "name": "Emotion 98.3", "url": "https://archive.org/download/gtavcrs/Emotion%2098.3.mp3" },
                { "name": "Fever 105", "url": "https://archive.org/download/gtavcrs/Fever%20105.mp3" },
                { "name": "Flash FM", "url": "https://archive.org/download/gtavcrs/Flash%20FM.mp3" },
                { "name": "K-Chat", "url": "https://archive.org/download/gtavcrs/K-Chat.mp3" },
                { "name": "Radio Espantoso", "url": "https://archive.org/download/gtavcrs/Radio%20Espantoso.mp3" },
                { "name": "V-Rock", "url": "https://archive.org/download/gtavcrs/V-Rock.mp3" },
                { "name": "VCPR", "url": "https://archive.org/download/gtavcrs/VCPR.mp3" },
                { "name": "Wave 103", "url": "https://archive.org/download/gtavcrs/Wave%20103.mp3" },
                { "name": "Wildstyle", "url": "https://archive.org/download/gtavcrs/Wildstyle.mp3" }
            ],
            "GTA IV": [
                { "name": "Electro-Choc", "url": "https://archive.org/download/GTA_iv_Radio/Electro-Choc.mp3" },
                { "name": "Integrity 2.0", "url": "https://archive.org/download/GTA_iv_Radio/Integrity%202.0.mp3" },
                { "name": "Jazz Nation Radio 108.5", "url": "https://archive.org/download/GTA_iv_Radio/Jazz%20Nation%20Radio%20108.5.mp3" },
                { "name": "K109 The Studio", "url": "https://archive.org/download/GTA_iv_Radio/K109%20The%20Studio.mp3" },
                { "name": "Liberty City Hardcore", "url": "https://archive.org/download/GTA_iv_Radio/Liberty%20City%20Hardcore.mp3" },
                { "name": "Liberty Rock Radio", "url": "https://archive.org/download/GTA_iv_Radio/Liberty%20Rock%20Radio.mp3" },
                { "name": "Massive B Soundsystem 96.9", "url": "https://archive.org/download/GTA_iv_Radio/Massive%20B%20Soundsystem%2096.9.mp3" },
                { "name": "Public Liberty Radio", "url": "https://archive.org/download/GTA_iv_Radio/Public%20Liberty%20Radio.mp3" },
                { "name": "Radio Broker", "url": "https://archive.org/download/GTA_iv_Radio/Radio%20Broker.mp3" },
                { "name": "RamJam FM", "url": "https://archive.org/download/GTA_iv_Radio/RamJam%20FM.mp3" },
                { "name": "San Juan Sounds", "url": "https://archive.org/download/GTA_iv_Radio/San%20Juan%20Sounds.mp3" },
                { "name": "Self-Actualization FM", "url": "https://archive.org/download/GTA_iv_Radio/Self-Actualization%20FM.mp3" },
                { "name": "The Beat 102.7", "url": "https://archive.org/download/GTA_iv_Radio/The%20Beat%20102.7.mp3" },
                { "name": "The Classics 104.1", "url": "https://archive.org/download/GTA_iv_Radio/The%20Classics%20104.1.mp3" },
                { "name": "The Journey", "url": "https://archive.org/download/GTA_iv_Radio/The%20Journey.mp3" },
                { "name": "The Vibe 98.8", "url": "https://archive.org/download/GTA_iv_Radio/The%20Vibe%2098.8.mp3" },
                { "name": "Tuff Gong Radio", "url": "https://archive.org/download/GTA_iv_Radio/Tuff%20Gong%20Radio.mp3" },
                { "name": "Vice City FM", "url": "https://archive.org/download/GTA_iv_Radio/Vice%20City%20FM.mp3" },
                { "name": "Vladivostok FM", "url": "https://archive.org/download/GTA_iv_Radio/Vladivostok%20FM.mp3" },
                { "name": "WKTT Radio", "url": "https://archive.org/download/GTA_iv_Radio/WKTT%20Radio.mp3" }
            ],
            "GTA V": [
                { "name": "Blaine County Radio", "url": "https://archive.org/download/GTAVRadioStations/GTA%20V%20Radio%20Stations/Blaine%20County%20Radio.mp3" },
                { "name": "Blonded Radio", "url": "https://archive.org/download/GTAVRadioStations/GTA%20V%20Radio%20Stations/Blonded%20Radio.mp3" },
                { "name": "Blue Ark", "url": "https://archive.org/download/GTAVRadioStations/GTA%20V%20Radio%20Stations/Blue%20Ark.mp3" },
                { "name": "Channel X", "url": "https://archive.org/download/GTAVRadioStations/GTA%20V%20Radio%20Stations/Channel%20X.mp3" },
                { "name": "East Los FM", "url": "https://archive.org/download/GTAVRadioStations/GTA%20V%20Radio%20Stations/East%20Los%20FM.mp3" },
                { "name": "FlyLo FM", "url": "https://archive.org/download/GTAVRadioStations/GTA%20V%20Radio%20Stations/FlyLo%20FM.mp3" },
                { "name": "Los Santos Rock Radio", "url": "https://archive.org/download/GTAVRadioStations/GTA%20V%20Radio%20Stations/Los%20Santos%20Rock%20Radio.mp3" },
                { "name": "Los Santos Underground Radio", "url": "https://archive.org/download/GTAVRadioStations/GTA%20V%20Radio%20Stations/Los%20Santos%20Underground%20Radio.mp3" },
                { "name": "Non-Stop-Pop FM", "url": "https://archive.org/download/GTAVRadioStations/GTA%20V%20Radio%20Stations/Non-Stop-Pop%20FM.mp3" },
                { "name": "Radio Los Santos", "url": "https://archive.org/download/GTAVRadioStations/GTA%20V%20Radio%20Stations/Radio%20Los%20Santos.mp3" },
                { "name": "Radio Mirror Park", "url": "https://archive.org/download/GTAVRadioStations/GTA%20V%20Radio%20Stations/Radio%20Mirror%20Park.mp3" },
                { "name": "Rebel Radio", "url": "https://archive.org/download/GTAVRadioStations/GTA%20V%20Radio%20Stations/Rebel%20Radio.mp3" },
                { "name": "Soulwax FM", "url": "https://archive.org/download/GTAVRadioStations/GTA%20V%20Radio%20Stations/Soulwax%20FM.mp3" },
                { "name": "Space 103.2", "url": "https://archive.org/download/GTAVRadioStations/GTA%20V%20Radio%20Stations/Space%20103.2.mp3" },
                { "name": "The Lab", "url": "https://archive.org/download/GTAVRadioStations/GTA%20V%20Radio%20Stations/The%20Lab.mp3" },
                { "name": "Vinewood Boulevard Radio", "url": "https://archive.org/download/GTAVRadioStations/GTA%20V%20Radio%20Stations/Vinewood%20Boulevard%20Radio.mp3" },
                { "name": "West Coast Classics", "url": "https://archive.org/download/GTAVRadioStations/GTA%20V%20Radio%20Stations/West%20Coast%20Classics.mp3" },
                { "name": "West Coast Talk Radio", "url": "https://archive.org/download/GTAVRadioStations/GTA%20V%20Radio%20Stations/West%20Coast%20Talk%20Radio.mp3" },
                { "name": "WorldWide FM", "url": "https://archive.org/download/GTAVRadioStations/GTA%20V%20Radio%20Stations/WorldWide%20FM.mp3" }
            ]
        };

        const player = document.getElementById('radioPlayer');
        const container = document.getElementById('stationContainer');
        const volumeControl = document.getElementById('volume');
        const currentStationDisplay = document.getElementById('currentStation');
        const scramblerBtn = document.getElementById('scramblerBtn');

        let currentActiveBtn = null;
        let isScramblerMode = false;

        // Flatten stations for Scrambler mode
        const allStations = [];
        for (const [gameName, gameStations] of Object.entries(stationsByGame)) {
            gameStations.forEach(station => {
                allStations.push({ ...station, gameName });
            });
        }

        // Initialize Volume
        player.volume = volumeControl.value;

        // Generate Buttons
        for (const [gameName, gameStations] of Object.entries(stationsByGame)) {
            // Create game header
            const header = document.createElement('h2');
            header.className = 'game-header';
            header.textContent = gameName;
            container.appendChild(header);

            gameStations.forEach((station, index) => {
                const btn = document.createElement('button');
                btn.className = 'station-btn';
                btn.textContent = station.name;

                btn.addEventListener('click', () => {
                    // Disable scrambler mode if manual selection is made
                    if (isScramblerMode) {
                        isScramblerMode = false;
                        scramblerBtn.classList.remove('active');
                    }

                    // If clicking the active station, turn it off
                    if (currentActiveBtn === btn) {
                        player.pause();
                        btn.classList.remove('active');
                        currentActiveBtn = null;
                        currentStationDisplay.textContent = 'Tuned Out';
                        return;
                    }

                    // Remove active class from previous
                    if (currentActiveBtn) {
                        currentActiveBtn.classList.remove('active');
                    }

                    // Set new active
                    btn.classList.add('active');
                    currentActiveBtn = btn;

                    // Play station
                    player.src = station.url;

                    // Random seek to simulate radio
                    player.addEventListener('loadedmetadata', function onLoaded() {
                        if (player.duration !== Infinity && !isNaN(player.duration)) {
                            player.currentTime = Math.random() * player.duration;
                        }
                        player.removeEventListener('loadedmetadata', onLoaded);
                    });

                    player.play().catch(e => console.error("Playback failed", e));
                    currentStationDisplay.textContent = `Playing: ${station.name} (${gameName})`;
                });

                container.appendChild(btn);
            });
        }

        // Volume control
        volumeControl.addEventListener('input', (e) => {
            player.volume = e.target.value;
        });

        function playRandomStation() {
            if (allStations.length === 0) return;

            // Un-highlight manual selection if any
            if (currentActiveBtn) {
                currentActiveBtn.classList.remove('active');
                currentActiveBtn = null;
            }

            const randomIndex = Math.floor(Math.random() * allStations.length);
            const randomStation = allStations[randomIndex];

            player.src = randomStation.url;

            player.addEventListener('loadedmetadata', function onLoaded() {
                if (player.duration !== Infinity && !isNaN(player.duration)) {
                    player.currentTime = Math.random() * player.duration;
                }
                player.removeEventListener('loadedmetadata', onLoaded);
            });

            player.play().catch(e => console.error("Playback failed", e));
            currentStationDisplay.textContent = `Scrambler Mode: ${randomStation.name} (${randomStation.gameName})`;
        }

        // Scrambler mode logic
        scramblerBtn.addEventListener('click', () => {
            isScramblerMode = !isScramblerMode;
            if (isScramblerMode) {
                scramblerBtn.classList.add('active');
                playRandomStation();
            } else {
                scramblerBtn.classList.remove('active');
                player.pause();
                currentStationDisplay.textContent = 'Tuned Out';
                if (currentActiveBtn) {
                    currentActiveBtn.classList.remove('active');
                    currentActiveBtn = null;
                }
            }
        });

        // Loop audio when it ends to simulate continuous radio, or play random in Scrambler mode
        player.addEventListener('ended', () => {
             if (isScramblerMode) {
                 playRandomStation();
             } else {
                 player.currentTime = 0;
                 player.play();
             }
        });

    </script>
</body>
</html>
